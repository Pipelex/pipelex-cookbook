####################################################################################################
# Pipelex Model Deck - Custom Configurations for Document Extraction Models
####################################################################################################
#
# This file allows you to override or complete the base model decks.
#
# ADVANCED USERS ONLY: This file is for users who want a model handle to resolve to something
# other than what the shipped deck gives it, across the backends they enabled (Azure, Mistral, etc.).
#
# If the shipped deck already resolves to models your enabled backends serve, you don't need
# to modify this file.
#
# Waterfalls are useful when using multiple backends directly - they define ordered lists
# of models that are resolved at configuration time based on which backends are available.
# This enables defining pipelines that work across different environments with varying
# backend configurations.
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
####################################################################################################


####################################################################################################
# Waterfalls — ordered lists of models resolved at configuration time by backend availability
#####################################################################################################

# Example (uncomment to use):
# [extract.waterfalls]
# document_extractor = ["azure-document-intelligence", "mistral-document-ai-2505"]
# pdf_text_extractor = [
#     "azure-document-intelligence",
#     "mistral-document-ai-2505",
#     "pypdfium2-extract-pdf",
# ]
# image_text_extractor = [
#     "azure-document-intelligence",
#     "mistral-document-ai-2505",
# ]
####################################################################################################

####################################################################################################
# Aliases — override the shipped extraction defaults
####################################################################################################
#
# The shipped deck resolves document extraction to `azure-document-intelligence`, which the
# backend catalogs here do not carry. Mistral's OCR model is the extraction model the cookbook
# runs on: set MISTRAL_API_KEY in your .env file.

[extract.aliases]
default-premium = "mistral-ocr"
default-extract-document = "mistral-ocr"
default-extract-image = "mistral-ocr"

# Methods vendored from github.com/Pipelex/methods name `azure-document-intelligence` directly
# rather than through an alias, so the handle itself is pointed at the model the cookbook runs on.
azure-document-intelligence = "mistral-ocr"
