chatbot = "Run {address} on {samples} with the question \"Among all 12 references in this report, how many are from its own research center?\""
app_dir = "qa-app"
yours_dir = "document-qa"
yours_change = "have it answer in the language of the question"

# The two inputs of this sample have no source-and-licence record yet: the report is linked where a benchmark dataset hosts it, under terms not
# established as allowing its copy here, and the question comes from that benchmark.

