# The cookbook's editorial fields, read by `make render` to write each method's page, methods/<name>/README.md.
# Everything else a page says comes from the package itself: its manifest, its inputs.json, its contract.json and its output.json.
# Every field of a method's entry is optional, and a method with no entry still gets a page from its manifest, except its sample records:
# each input of the sample has one under [methods.<name>.samples.<input>], with its link text, whether it was made up (`synthetic`), where it
# was copied from and when (`source` and `retrieved`, for a real input only), its licence (`license`, `license_url`), its credit line
# (`attribution`) and what was changed from the source (`changes`, optional), and `make check-render` fails on an input without one.
# [methods.<name>.output] holds the two optional hints on how the page shows the output: `formats`, how a text field reads (markdown, html or
# text), and `item_label`, the noun naming each item of a list output. docs/README.md says more.

# The address every cookbook manifest carries: the runtime locates a package by this address and the manifest's name.
address = "github.com/Pipelex/pipelex-cookbook"
# The GitHub repository that the samples' raw URLs point into.
repository = "Pipelex/pipelex-cookbook"

# The method library the front page lists, at the tag its snapshot, library.json, was taken from.
# `make refresh-library` rewrites the snapshot from this tag, and `make refresh` runs it first; `make render` reads only the snapshot.
[library]
address = "github.com/Pipelex/methods"
repository = "Pipelex/methods"
tag = "v0.1.2"

[methods.discord_newsletter]
title = "Weekly newsletter for a Discord community"
pitch = "Read a week of a community's Discord channels and return the members' newsletter in the team's fixed format, as HTML ready for the email tool: the week in a few lines, the new members welcomed, a section for each channel in the server's order with each conversation given as its outcome, and the news of each local hub, in English whatever language a message was written in."
app_dir = "newsletter-app"
yours_dir = "newsletter"
yours_change = "add a Coming up section after the week's summary, listing every event and deadline announced in the channels with its date"

[methods.discord_newsletter.samples.discord_channel_updates]
label = "sample week of a fictional community"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.discord_newsletter.output]
formats = { text = "html" }

[methods.extract_dpe]
title = "DPE record for a letting agency"
pitch = "Read a French energy performance diagnostic (DPE) and return the record a letting agency files for the flat: the ADEME number and the dates, both classes with their figures, the estimated yearly energy costs with the date their prices refer to, and what the class means for letting the flat under the agency's letting rules."
app_dir = "dpe-app"
yours_dir = "dpe"
yours_change = "add a short note to the owner saying what the class means for letting the flat and by when to plan the works"

[methods.extract_dpe.samples.document]
label = "sample DPE"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.gen_synthetic_data]
title = "Synthetic test tickets for a support triage"
pitch = "Read a description of the records a team needs and return a batch of realistic, varied synthetic records, each with the case it covers and its fields as the description gives them: here, customer service tickets, every one of them invented, with the queue and the priority the triage should give each, to test a change to the routing without a single real customer's message."
app_dir = "test-data-app"
yours_dir = "test-data"
yours_change = "also return the batch as CSV, one column per field, ready to import into the helpdesk's sandbox"

[methods.gen_synthetic_data.samples.data_description]
label = "sample description"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.gen_synthetic_data.samples.nb_samples]
label = "sample count"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.gen_synthetic_data.output]
item_label = "Ticket"

[methods.review_nda]
title = "NDA review against a playbook"
pitch = "Read a counterparty's NDA and the company's NDA playbook, and return a first-pass review with one row per playbook position, giving the clause that deals with it, whether it is acceptable, to negotiate or to refuse, and the playbook's fallback wording, then a verdict and a short note for the lawyer who signs off."
app_dir = "nda-review-app"
yours_dir = "nda-review"
yours_change = "add a short email to the counterparty asking for the changes the rows to negotiate or refuse call for"

[methods.review_nda.samples.nda]
label = "sample NDA"
synthetic = false
source = "https://github.com/CommonPaper/Mutual-NDA/tree/2a3068b6c0ab6015c440f541d5b215bc3ac2f4cb"
