[methods.review_nda.samples.playbook]
label = "sample playbook"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.write_release_post]
title = "Release post in the company's voice"
pitch = "Read a release's engineering notes and the company's style guide for release posts, and return the customer-facing blog post a product marketing manager pastes into the CMS: the title, slug, meta description, excerpt, category and tags, each held to the guide's limits, the body in Markdown written to the guide's rules, and what the post leaves out of the notes, with the rule that leaves it out, to check before publishing."
app_dir = "release-post-app"
yours_dir = "release-post"
yours_change = "add a social post of at most 280 characters announcing the release in the style guide's voice, beside the blog post"

