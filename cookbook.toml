# The cookbook's editorial fields, read by `make render` to write each method's page, methods/<name>/README.md.
# Everything else a page says comes from the package itself: its manifest, its inputs.json, its contract.json and its output.json.
# Every field of a method's entry is optional, and a method with no entry still gets a page from its manifest, except its sample records:
# each input of the sample has one under [methods.<name>.samples.<input>], with its link text, whether it was made up (`synthetic`), where it
# was copied from and when (`source` and `retrieved`, for a real input only), its licence (`license`, `license_url`), its credit line
# (`attribution`) and what was changed from the source (`changes`, optional), and `make check-render` fails on an input without one.
# [methods.<name>.output] holds the two optional hints on how the page shows the output: `formats`, how a text field reads (markdown, html or
# text), and `item_label`, the noun naming each item of a list output. docs/README.md says more.

# The address every cookbook manifest carries: the runtime locates a package by this address and the manifest's name.
address = "github.com/Pipelex/pipelex-cookbook"
# The GitHub repository that the samples' raw URLs point into.
repository = "Pipelex/pipelex-cookbook"

# The method library the front page lists, at the tag its snapshot, library.json, was taken from.
# `make refresh-library` rewrites the snapshot from this tag, and `make refresh` runs it first; `make render` reads only the snapshot.
[library]
address = "github.com/Pipelex/methods"
repository = "Pipelex/methods"
tag = "v0.1.2"

[methods.extract_gantt]
title = "Gantt chart extraction"
pitch = "Read a Gantt chart image and return every task with its start and end dates, and every milestone with its date."
chatbot = "Run {address} on {samples}"
app_dir = "gantt-app"
yours_dir = "gantt"
yours_change = "add each task's owner to what it extracts"

[methods.extract_gantt.samples.gantt_chart_image]
label = "sample chart"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.extract_slides]
title = "Slide deck extraction"
pitch = "Read a slide deck in PDF and return one Markdown text giving each slide its title, its text and a description of its layout and charts."
chatbot = "Run {address} on {samples}"
app_dir = "slides-app"
yours_dir = "slides"
yours_change = "add the speaker's key message for each slide to what it extracts"

[methods.extract_slides.samples.document]
label = "sample deck"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.extract_generic]
title = "Generic document extraction"
pitch = "Read any document and return each page as Markdown, including the text that only appears inside its images and diagrams."
chatbot = "Run {address} on {samples}"
app_dir = "extract-app"
yours_dir = "extract"
yours_change = "turn the tables it finds into CSV alongside the Markdown"

[methods.extract_generic.samples.document]
label = "sample article"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.extract_generic.output]
item_label = "Page"

[methods.advisory_board]
title = "Advisory board consultation"
pitch = "Read a business problem told in plain words, consult five to ten expert advisory boards on it, and return one strategic report in Markdown with their consensus, the choices they disagree on, a phased roadmap, risks, resources and success metrics."
chatbot = "Run {address} on this problem: \"We're a B2B SaaS company with $5M ARR whose annual churn rose from 8% to 15%. How do we get it under 10% within six months on a $500K budget?\""
app_dir = "advisory-app"
yours_dir = "advisory-board"
yours_change = "replace the sixteen boards it can consult with the teams of your own company"

[methods.advisory_board.samples.user_input]
label = "sample problem"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.blog_article_generator]
title = "Blog article generation"
pitch = "Read a topic, an audience, a tone and a length, and return an SEO-optimized blog article in Markdown with its SEO title and meta description."
chatbot = "Run {address} to write a long, casual blog article about capybaras for kids"
app_dir = "blog-app"
yours_dir = "blog"
yours_change = "add a list of target keywords to the request and make the article use them"

[methods.blog_article_generator.samples.user_prompt]
label = "sample request"
synthetic = true
license = "MIT"
license_url = "https://github.com/Pipelex/pipelex-cookbook/blob/main/LICENSE"
attribution = "Evotis S.A.S"

[methods.blog_article_generator.output]
formats = { content = "markdown" }

[methods.research_report]
title = "Research report"
pitch = "Read a research question and return a Markdown report with an executive summary, key findings and open questions, drafted from three angles out of the model's own knowledge without searching any source, so it is a first draft to check rather than verified research."
chatbot = "Run {address} on the question: what are the most promising approaches to improving battery energy density for electric vehicles?"
app_dir = "research-app"
yours_dir = "research"
yours_change = "research five angles instead of three"

