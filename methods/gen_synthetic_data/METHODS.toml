[package]
name = "gen_synthetic_data"
display_name = "Synthetic Data from a Description"
address = "github.com/Pipelex/pipelex-cookbook"
version = "0.20.0"
description = "Turn a description of the records wanted into a batch of varied synthetic records: the fields a record carries, the cases the batch must cover, then one record written for each case, with its fields as name and value pairs."
authors = ["Evotis S.A.S"]
license = "MIT"
mthds_version = ">=1.0.0"
main_pipe = "generate_synthetic_records"

[exports.synthetic_data_generation]
pipes = ["generate_synthetic_records"]
