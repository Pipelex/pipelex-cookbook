[package]
name = "research_report"
display_name = "Research Report"
address = "github.com/Pipelex/pipelex-cookbook"
version = "0.17.0"
description = "Research a question from three angles, fact-check each angle's main claim, and return a Markdown report with an executive summary, key findings and open questions."
authors = ["Evotis S.A.S"]
license = "MIT"
mthds_version = ">=1.0.0"
main_pipe = "prepare_report"

[exports.research_report]
pipes = ["prepare_report", "deep_research", "compose_report"]
