[package]
name = "gen_expense_data"
display_name = "Synthetic Expense Data Generation"
address = "github.com/Pipelex/pipelex-cookbook"
version = "0.19.1"
description = "Generate employees with expense claims, each backed by a photographed receipt image and labelled as legitimate or as one of four fraud patterns, plus an HTML expense report per employee."
authors = ["Evotis S.A.S"]
license = "MIT"
mthds_version = ">=1.0.0"
main_pipe = "generate_expense_dataset"

[exports.expense_data_generation]
pipes = ["generate_expense_dataset", "generate_employee_report"]
