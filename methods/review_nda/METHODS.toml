[package]
name = "review_nda"
display_name = "NDA Review Against a Playbook"
address = "github.com/Pipelex/pipelex-cookbook"
version = "0.20.3"
description = "Review a counterparty's NDA against the company's NDA playbook: one row per playbook position with the clause found, the assessment and the fallback wording, a verdict and a note for counsel."
authors = ["Evotis S.A.S"]
license = "MIT"
mthds_version = ">=1.0.0"
main_pipe = "review_nda_against_playbook"

[exports.nda_review]
pipes = ["review_nda_against_playbook"]
