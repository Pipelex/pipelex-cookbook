domain = "advisory_orchestrator"
definition = "Master Advisory Orchestrator system for complex business problem solving through multi-board consultation"

####################################################################################################
# Concepts
####################################################################################################

[concept]
BusinessProblem = "A structured representation of a business challenge requiring strategic guidance"
AdvisoryBoard = "An expert advisory board with specific domain expertise"
BoardResponse = "Response from an individual advisory board with recommendations"
ResponseAnalysis = "Analysis of all board responses identifying consensus and conflicts"
StrategicReport = "Final comprehensive strategic report with unified recommendations"

####################################################################################################
# Pipes
####################################################################################################

[pipe.master_advisory_orchestrator]
PipeSequence = "Master orchestrator that processes business problems through multi-board consultation"
inputs = { user_input = "Text" }
output = "StrategicReport"
steps = [
    { pipe = "classify_business_problem", result = "business_problem" },
    { pipe = "select_advisory_boards", result = "selected_advisory_boards" },
    { pipe = "consult_board", batch_over = "selected_advisory_boards", batch_as = "advisory_board", result = "board_consultations" },
    { pipe = "analyze_board_responses", result = "response_analysis" },
    { pipe = "generate_strategic_report", result = "strategic_report" },
]

[pipe.classify_business_problem]
PipeLLM = "Analyze and classify the business problem into structured format"
inputs = { user_input = "Text" }
output = "BusinessProblem"
system_prompt = "You are a business analysis expert who specializes in problem classification and structuring."
prompt_template = """
Analyze the following business challenge and structure it into a comprehensive problem definition:

@user_input

Please provide:
1. A clear problem statement
2. Relevant business context and background
3. Known constraints and limitations
4. Desired goals and outcomes
5. Primary problem category (product_launch, scaling, technical, financial, operational, strategic, marketing, or general)
6. Timeline urgency (immediate, short-term, long-term)
7. Key stakeholders involved

Structure this as a BusinessProblem with all the required fields filled out.
"""

[pipe.select_advisory_boards]
PipeLLM = "Select the most relevant advisory boards for the business problem"
inputs = { business_problem = "BusinessProblem" }
output = "AdvisoryBoard"
multiple_output = true
system_prompt = """You are an expert in organizational structure and advisory board composition. You know all available advisory boards and their expertise areas.

Available Advisory Boards:
- Executive Leadership Board (C-suite strategic perspective)
- Product Management Advisory Board (Product strategy and roadmap)
- GTM Advisory Board (Go-to-market strategy)
- Engineering & Technology Advisory Board (Technical architecture and implementation)
- Operation & Infra Advisory Board (Operations and infrastructure)
- Supply Chain & Procurement Advisory Board (Supply chain optimization)
- Marketing & Communication Advisory Board (Marketing strategy and messaging)
- Sales & Business operation Advisory Board (Sales strategy and operations)
- Growth Consulting Board (Growth strategy and scaling)
- Customer Success & Support Advisory Board (Customer retention and success)
- Finance & Corporate Development Advisory Board (Financial strategy and M&A)
- HR & People Advisory Board (Talent and organizational development)
- Design & UX Advisory Board (User experience and design strategy)
- Data Science & Analytics Board (Data strategy and analytics)
- Legal & Compliance Advisory Board (Legal and regulatory compliance)
- Security & Risk Management Advisory Board (Security and risk mitigation)"""
prompt_template = """
Based on the following business problem, select 5-10 most relevant advisory boards:

@business_problem

For each selected board, provide:
1. Board name (exact match from the available list)
2. Their specific expertise area
3. Relevance score (0-10) for this problem
4. Rationale for why this board was selected
"""

[pipe.consult_board]
PipeLLM = "Consult an advisory board based on the business problem and selection"
inputs = { business_problem = "BusinessProblem", advisory_board = "AdvisoryBoard" }
output = "BoardResponse"
multiple_output = true
system_prompt = "Based on the selected boards, provide responses from each relevant board's perspective."
prompt_template = """
Based on the following business problem and selected advisory board, provide board response:

Business Problem:
@business_problem

Selected Advisory Board:
@advisory_board

Provide a comprehensive BoardResponse that includes:

1. **Strategic Analysis**: Analysis from the specific board's domain expertise
2. **Recommendations**: Specific recommendations with rationale, implementation timelines, resource requirements, risks, success metrics, and confidence levels
3. **Implementation Considerations**: Key implementation factors specific to the board's domain
4. **Risk Mitigation**: Risk mitigation strategies from the board's perspective
5. **Dependencies**: Dependencies on other functional areas

Your response should:
- Have the exact board name
- Provide domain-specific strategic analysis
- Include detailed recommendations appropriate to that board's expertise
- Consider the board's unique perspective on the business problem

"""

[pipe.analyze_board_responses]
PipeLLM = "Analyze all board responses to identify consensus, conflicts, and insights"
inputs = { board_consultations = "BoardResponse" }
output = "ResponseAnalysis"
system_prompt = "You are a strategic analysis expert who specializes in synthesizing multiple expert opinions and identifying patterns, consensus, and conflicts."
prompt_template = """
Analyze the following advisory board responses to identify patterns and insights:

All Board Responses:
@board_consultations

Please provide a comprehensive ResponseAnalysis that includes:

1. **Consensus Items**: Recommendations supported by multiple boards with confidence scores and priority levels
2. **Conflicts**: Areas where boards disagree, including the core tensions and decision frameworks
3. **Unique Insights**: Perspectives that only one board provides
4. **Dependencies**: Cross-functional dependencies identified across responses
5. **Resource Overlaps**: Areas where multiple boards compete for the same resources

For each consensus item, calculate a confidence score (1-10) based on the number of supporting boards and alignment of their reasoning.
For conflicts, identify the core tension and suggest decision frameworks for resolution.
"""

[pipe.generate_strategic_report]
PipeLLM = "Generate comprehensive strategic report synthesizing all insights"
inputs = { business_problem = "BusinessProblem", selected_advisory_boards = "AdvisoryBoard", board_consultations = "BoardResponse", response_analysis = "ResponseAnalysis" }
output = "StrategicReport"
system_prompt = "You are a senior strategy consultant who specializes in creating comprehensive strategic reports that synthesize complex multi-stakeholder input into actionable recommendations."
prompt_template = """
Create a comprehensive strategic report based on the following inputs:

Original Problem:
@business_problem

Advisory Boards Consulted:
@selected_advisory_boards

All Board Responses:
@board_consultations

Analysis Results:
@response_analysis

Generate a StrategicReport that includes:

**Executive Summary**: Brief overview with problem statement, boards consulted, top 3 consensus recommendations, and critical decision points

**Detailed Recommendations**:
- High consensus recommendations with supporting boards, timelines, resources, and success metrics
- Strategic choices where boards conflict, with decision criteria and synthesis recommendations
- Domain-specific insights by functional area

**Implementation Roadmap**:
- Phase 1 (0-30 days): Immediate actions with lead responsibility
- Phase 2 (1-3 months): Short-term actions with lead responsibility
- Phase 3 (3+ months): Long-term actions with lead responsibility

**Risk Assessment**: High, medium, and low risks with specific mitigation strategies and owners

**Resource Requirements**: Budget, personnel, technology, and timeline requirements

**Success Metrics**: Primary KPIs, secondary metrics, and review cadence

**Next Steps**: Immediate actions and recommended review schedule

Ensure all recommendations are specific, actionable, and include clear ownership and timelines.
"""

